<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml">
  <title>Checkout - ShopNow</title>
  <link rel="stylesheet" href="../css/store.css">
</head>
<body class="page" data-root="../">
  <header class="store-header">
    <div class="store-header__inner">
      <a class="store-brand" href="../index.html"><span class="store-brand__mark">S</span><span data-store-name>ShopNow</span></a>
      <nav class="store-nav" aria-label="Principal" data-categories-nav></nav>
      <div class="store-actions">
        <button class="icon-btn" aria-label="Buscar" data-search-toggle>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <a class="icon-btn" href="cart.html" aria-label="Carrinho">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </a>
        <a class="btn btn-ghost cart-pill" href="account.html" data-login-btn>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Entrar
        </a>
      </div>
    </div>
  </header>

  <div class="search-overlay" data-search-overlay aria-hidden="true">
    <div class="search-overlay__inner">
      <form class="search-overlay__form" data-store-search>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-overlay__input" type="search" placeholder="Buscar produtos...">
        <button class="search-overlay__close" type="button" data-search-close aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </form>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">Checkout</h1>
      </div>
      <div class="split-grid">
        <form class="checkout-form card" data-checkout-form>
          <h2>Dados do cliente</h2>
          <div class="form-grid">
            <input class="field field--full" name="customerName" required placeholder="Nome completo">
            <input class="field" name="email" required type="email" placeholder="E-mail">
            <input class="field" name="phone" required placeholder="Telefone">
          </div>

          <h2 style="margin-top: 28px;">Entrega</h2>
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--brand); border-radius: 8px; background: var(--brand-soft); margin-bottom: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div>
              <strong style="color: var(--brand); font-size: 14px;">Retirar na loja</strong>
              <p style="margin: 2px 0 0; font-size: 13px; color: var(--muted);">Retire seu pedido diretamente em nossa loja</p>
            </div>
          </div>

          <h2 style="margin-top: 28px;">Forma de pagamento</h2>
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--brand); border-radius: 8px; background: var(--brand-soft); margin-bottom: 12px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <div>
              <strong style="color: var(--brand); font-size: 14px;">Pagamento na retirada</strong>
              <p style="margin: 2px 0 0; font-size: 13px; color: var(--muted);">Pague em dinheiro, cartÃ£o ou PIX na loja</p>
            </div>
          </div>

          <p style="font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Em breve</p>
          <div class="payment-options" style="opacity: 0.45; pointer-events: none;">
            <button class="payment-option" type="button" disabled>
              CartÃ£o online
              <span style="font-size: 10px; background: var(--muted); color: #fff; border-radius: 4px; padding: 1px 5px; margin-left: 6px;">Em breve</span>
            </button>
            <button class="payment-option" type="button" disabled>
              PIX
              <span style="font-size: 10px; background: var(--muted); color: #fff; border-radius: 4px; padding: 1px 5px; margin-left: 6px;">Em breve</span>
            </button>
            <button class="payment-option" type="button" disabled>
              Boleto
              <span style="font-size: 10px; background: var(--muted); color: #fff; border-radius: 4px; padding: 1px 5px; margin-left: 6px;">Em breve</span>
            </button>
          </div>

          <button class="btn btn-primary checkout-submit" type="submit" style="margin-top: 24px;">Confirmar pedido</button>
        </form>
        <aside class="summary card checkout-summary" data-checkout-summary></aside>
      </div>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/store-name.js"></script>
  <script src="../js/ui/store-config.js"></script>
  <script src="../js/ui/common.js"></script>
  <script>
    if (!localStorage.getItem('user')) window.location.href = 'login.html';
  </script>
  <script src="../js/ui/form-validation.js"></script>
  <script src="../js/ui/admin-sync.js"></script>
  <script src="../js/ui/store-checkout.js"></script>
</body>
</html>
