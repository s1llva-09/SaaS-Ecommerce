<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNow</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body class="page" data-root="../">
  <header class="store-header">
    <div class="store-header__inner">
      <a class="store-brand" href="../index.html"><span class="store-brand__mark">S</span><span>ShopNow</span></a>
      <nav class="store-nav" aria-label="Principal">
        <a href="products.html">Produtos</a>
        <a href="products.html?category=Eletr%C3%B4nicos">Eletrônicos</a>
        <a href="products.html?category=Moda">Moda</a>
        <a href="products.html?category=Cal%C3%A7ados">Calçados</a>
      </nav>
      <div class="store-actions">
        <button class="icon-btn" aria-label="Buscar" data-search-toggle>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <a class="icon-btn" style="position:relative" href="cart.html" aria-label="Carrinho">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" data-cart-count style="position:absolute;top:-6px;right:-6px;display:none">0</span>
        </a>
        <a class="btn btn-ghost cart-pill" href="account.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Entrar
        </a>
      </div>
    </div>
  </header>

  <div class="search-overlay" data-search-overlay aria-hidden="true">
    <div class="search-overlay__inner">
      <form class="search-overlay__form" data-store-search>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-overlay__input" type="search" placeholder="Buscar produtos...">
        <button class="search-overlay__close" type="button" data-search-close aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </form>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">Checkout</h1>
      </div>
      <div class="split-grid">
        <form class="checkout-form card" data-checkout-form>
          <h2>Dados do cliente</h2>
          <div class="form-grid">
            <input class="field" style="grid-column:1/-1" required placeholder="Nome completo">
            <input class="field" required type="email" placeholder="E-mail">
            <input class="field" required placeholder="Telefone">
            <input class="field" required placeholder="CEP" maxlength="9">
          </div>
          <h2>Forma de pagamento</h2>
          <div class="payment-options">
            <button class="payment-option is-active" type="button" data-payment-option>💳 Cartão</button>
            <button class="payment-option" type="button" data-payment-option>💰 PIX</button>
            <button class="payment-option" type="button" data-payment-option>📄 Boleto</button>
          </div>
          <button class="btn btn-primary" style="width:100%;min-height:52px;font-size:16px;border-radius:14px" type="submit">Confirmar pedido →</button>
        </form>
        <aside class="summary card" data-checkout-summary></aside>
      </div>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/ui/common.js"></script>
  <script src="../js/ui/store-checkout.js"></script>
</body>
</html>
