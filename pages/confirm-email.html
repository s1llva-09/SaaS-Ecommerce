<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml">
  <title>Confirmando Email - ShopNow</title>
  <link rel="stylesheet" href="../css/index.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(90deg, rgba(17, 24, 39, .76), rgba(17, 24, 39, .58)),
        url("https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=1400&q=82") center/cover;
    }

    .confirm-container {
      width: min(500px, 100%);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .confirm-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: var(--radius);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .confirm-icon svg {
      width: 42px;
      height: 42px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #dfe7ef;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .confirm-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.15;
    }

    .confirm-message {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .confirm-status {
      margin-bottom: 22px;
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 14px;
      font-weight: 800;
    }

    .confirm-status.loading {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .confirm-status.success {
      background: var(--green-soft);
      color: var(--green);
    }

    .confirm-status.error {
      background: var(--red-soft);
      color: var(--red);
    }

    .confirm-action {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="confirm-container">
    <div class="confirm-icon">
      <div class="spinner" id="spinner"></div>
      <svg id="success-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
      <svg id="error-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M15 9 9 15"></path>
        <path d="M9 9l6 6"></path>
      </svg>
    </div>

    <h1 class="confirm-title" id="title">Confirmando seu email</h1>
    <p class="confirm-message" id="message">Aguarde enquanto validamos seu email.</p>

    <div class="confirm-status loading" id="status">Processando confirmação...</div>

    <div class="confirm-action" id="actions">
      <button class="btn btn-primary" disabled>Aguarde...</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nnkokgtplnuhmhlqarba.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ua29rZ3RwbG51aG1obHFhcmJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjk3MjUsImV4cCI6MjA5NDgwNTcyNX0.2nf1eytsNVNAAi4FymsmTSQEnwpzokGRXV6Lbp7k0pU';

    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const statusEl = document.getElementById('status');
    const actionsEl = document.getElementById('actions');
    const spinnerEl = document.getElementById('spinner');
    const successIconEl = document.getElementById('success-icon');
    const errorIconEl = document.getElementById('error-icon');

    function showSuccess(accessToken, user) {
      if (accessToken) {
        localStorage.setItem('supabase_token', accessToken);
      }
      if (user) {
        localStorage.setItem('user', JSON.stringify({
          id: user.id,
          email: user.email,
          name: user.user_metadata?.name || 'Usuário',
        }));
      }

      titleEl.textContent = 'Email confirmado';
      messageEl.textContent = 'Seu email foi confirmado com sucesso. Você já pode fazer login.';
      statusEl.textContent = 'Email confirmado com sucesso';
      statusEl.className = 'confirm-status success';
      spinnerEl.style.display = 'none';
      successIconEl.style.display = 'block';
      actionsEl.innerHTML = `
        <a href="login.html" class="btn btn-primary">Ir para login</a>
        <a href="../index.html" class="btn btn-ghost">Ir para loja</a>
      `;
      setTimeout(() => { window.location.href = 'login.html'; }, 3000);
    }

    function showError(title, message) {
      titleEl.textContent = title;
      messageEl.textContent = message;
      statusEl.textContent = title;
      statusEl.className = 'confirm-status error';
      spinnerEl.style.display = 'none';
      errorIconEl.style.display = 'block';
      actionsEl.innerHTML = `
        <a href="register.html" class="btn btn-primary">Tentar novamente</a>
        <a href="../index.html" class="btn btn-ghost">Ir para loja</a>
      `;
    }

    async function confirmEmail() {
      // Supabase redireciona de duas formas após verificar o link:
      // 1. Hash: #access_token=...&type=signup  (fluxo implícito)
      // 2. Query: ?token=...&type=signup         (fluxo antigo — precisa chamar /verify)
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);

      const error = hash.get('error') || query.get('error');
      if (error) {
        showError('Link inválido', hash.get('error_description') || query.get('error_description') || 'O link expirou ou é inválido.');
        return;
      }

      // Fluxo 1: Supabase já verificou, temos o access_token no hash
      const accessToken = hash.get('access_token');
      const hashType = hash.get('type');
      if (accessToken && (hashType === 'signup' || hashType === 'email')) {
        try {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}` },
          });
          const user = res.ok ? await res.json() : null;
          showSuccess(accessToken, user);
        } catch {
          showSuccess(accessToken, null);
        }
        return;
      }

      // Fluxo 2: token na query string — chama /verify
      const token = query.get('token');
      const queryType = query.get('type');
      if (token && (queryType === 'signup' || queryType === 'email')) {
        try {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
            body: JSON.stringify({ type: 'signup', token }),
          });
          if (!res.ok) throw new Error();
          const data = await res.json();
          showSuccess(data.access_token || data.session?.access_token, data.user);
        } catch {
          showError('Erro na confirmação', 'O link pode ter expirado. Tente criar sua conta novamente.');
        }
        return;
      }

      showError('Link inválido', 'O link de confirmação é inválido ou expirou.');
    }

    confirmEmail();
  </script>
</body>
</html>
