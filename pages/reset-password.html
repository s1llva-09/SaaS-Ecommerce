<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml">
  <title>Redefinir Senha - ShopNow</title>
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body class="page auth-page">
  <div class="auth-container">
    <div class="auth-welcome">
      <div class="auth-welcome__content">
        <a href="../index.html" class="store-brand auth-brand">
          <span class="store-brand__mark">S</span>
          <span data-store-name>ShopNow</span>
        </a>

        <h1>Redefinir senha</h1>
        <p>Crie uma nova senha para proteger sua conta e voltar Ã s compras.</p>
      </div>
    </div>

    <div class="auth-form-container">
      <div class="auth-form">
        <h2>Nova senha</h2>
        <p class="auth-form__subtitle">Digite uma senha segura para continuar</p>

        <form id="resetPasswordForm" class="form">
          <div class="form-group">
            <label for="password" class="form-label">Senha</label>
            <div class="password-field">
              <input type="password" id="password" name="password" class="field password-input" placeholder="Pelo menos 8 caracteres" minlength="8" required autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Mostrar ou esconder senha" data-toggle-password>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <small>MÃ­nimo de 8 caracteres, com nÃºmeros e letras</small>
          </div>

          <div class="form-group">
            <label for="confirm-password" class="form-label">Confirmar senha</label>
            <div class="password-field">
              <input type="password" id="confirm-password" name="confirm-password" class="field password-input" placeholder="Repita sua senha" required autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Mostrar ou esconder senha" data-toggle-password>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn--full" style="margin-top: 22px;">Redefinir senha</button>
        </form>

        <p class="auth-form__footer">
          Lembrou a senha? <a href="login.html">Fazer login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/store-name.js"></script>
  <script src="../js/ui/store-config.js"></script>
  <script src="../js/ui/common.js"></script>
  <script>
    // Extrai access_token do hash apÃ³s redirect do Supabase (tipo recovery)
    (function () {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const token = hash.get('access_token');
      const type = hash.get('type');
      if (token && type === 'recovery') {
        localStorage.setItem('supabase_token', token);
      } else if (!localStorage.getItem('supabase_token')) {
        window.location.href = 'forgot-password.html';
      }
    })();
  </script>
  <script src="../js/ui/auth-supabase.js"></script>
</body>
</html>
