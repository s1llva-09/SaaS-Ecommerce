<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml">
  <title>Minha conta - ShopNow</title>
  <link rel="stylesheet" href="../css/store.css">
</head>
<body class="page" data-root="../">
  <header class="store-header">
    <div class="store-header__inner">
      <a class="store-brand" href="../index.html"><span class="store-brand__mark">S</span><span data-store-name>ShopNow</span></a>
      <nav class="store-nav" aria-label="Principal" data-categories-nav></nav>
      <div class="store-actions">
        <button class="icon-btn" aria-label="Buscar" data-search-toggle>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <a class="icon-btn" href="cart.html" aria-label="Carrinho">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </a>
        <a class="btn btn-ghost cart-pill" href="account.html" data-login-btn>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Entrar
        </a>
      </div>
    </div>
  </header>

  <div class="search-overlay" data-search-overlay aria-hidden="true">
    <div class="search-overlay__inner">
      <form class="search-overlay__form" data-store-search>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-overlay__input" type="search" placeholder="Buscar produtos...">
        <button class="search-overlay__close" type="button" data-search-close aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </form>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div class="account-profile-card card">
        <div class="account-profile-header">
          <div class="account-profile-top">
            <div class="account-avatar" data-user-avatar></div>
            <div class="account-profile-info">
              <h1 class="account-profile-name" data-user-name></h1>
              <p class="account-profile-email" data-user-email></p>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-outline btn-sm" data-edit-profile-btn aria-label="Editar perfil">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Editar
            </button>
            <button class="btn btn-outline btn-sm" data-logout-btn aria-label="Fazer logout">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
              Sair
            </button>
          </div>
        </div>
        <div class="account-profile-divider"></div>
        <div class="account-profile-stats">
          <div class="account-stat">
            <span class="account-stat-label">Pedidos</span>
            <span class="account-stat-value" data-orders-count>0</span>
          </div>
          <div class="account-stat">
            <span class="account-stat-label">Gasto total</span>
            <span class="account-stat-value" data-spent-total>R$ 0</span>
          </div>
          <div class="account-stat">
            <span class="account-stat-label">Status</span>
            <span class="account-stat-value account-stat-status">Ativo</span>
          </div>
        </div>
      </div>

      <h2 class="section-title account-orders-title">Pedidos recentes</h2>
      <section class="order-list" data-order-list></section>
    </div>
  </main>

  <div class="logout-modal-overlay" data-edit-profile-overlay aria-hidden="true"></div>
  <div class="logout-modal" data-edit-profile-modal aria-hidden="true">
    <div class="logout-modal__content">
      <h3 class="logout-modal__title" style="margin-bottom: 24px;">Editar perfil</h3>
      <form data-edit-profile-form style="display: flex; flex-direction: column; gap: 16px;">
        <input type="text" name="name" placeholder="Nome completo" class="field" required>
        <input type="email" name="email" placeholder="E-mail" class="field" required>
        <input type="tel" name="phone" placeholder="Telefone (opcional)" class="field">
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="btn btn-outline" type="button" data-edit-profile-cancel>Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar mudanÃ§as</button>
        </div>
      </form>
    </div>
  </div>

  <div class="logout-modal-overlay" data-logout-overlay aria-hidden="true"></div>
  <div class="logout-modal" data-logout-modal aria-hidden="true">
    <div class="logout-modal__content">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
      <h3 class="logout-modal__title">Fazer logout?</h3>
      <p class="logout-modal__message">Tem certeza que deseja sair da sua conta?</p>
      <div class="logout-modal__actions">
        <button class="btn btn-outline" data-logout-cancel>Cancelar</button>
        <button class="btn btn-primary" data-logout-confirm>Sair</button>
      </div>
    </div>
  </div>

  <div class="od-overlay" data-od-overlay></div>

  <aside class="od-drawer" data-od-drawer aria-hidden="true">
    <div class="od-drawer__header">
      <button class="od-close" data-od-close aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <span data-od-title>Detalhe do pedido</span>
    </div>
    <div class="od-drawer__body" data-od-body></div>
  </aside>

  <script src="../js/data.js"></script>
  <script src="../js/store-name.js"></script>
  <script src="../js/ui/store-config.js"></script>
  <script src="../js/ui/common.js"></script>
  <script src="../js/ui/admin-sync.js"></script>
  <script src="../js/ui/store-account.js"></script>
</body>
</html>
