<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../imgs/favicon.svg" type="image/svg+xml">
  <title>Produtos - ShopNow Admin</title>
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-page" data-root="../../">
  <div class="admin-shell">
    <div class="admin-sidebar-overlay" data-sidebar-overlay></div>
    <aside class="admin-sidebar">
      <a class="admin-brand" href="dashboard.html">
        <span class="admin-brand__mark">S</span>
        <span data-store-name><small>Admin Panel</small></span>
      </a>
      <nav class="admin-nav">
        <a href="dashboard.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
          Dashboard
        </a>
        <a class="is-active" href="products.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
          Produtos
        </a>
        <a href="orders.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span>
          Pedidos
          <span class="admin-nav__badge" data-orders-badge style="display: none;"></span>
        </a>
        <a href="customers.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          Clientes
        </a>
        <p class="admin-nav__section">Financeiro</p>
        <a href="cashflow.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span>
          Caixa
        </a>
        <a href="reports.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
          Relatórios
          <span class="admin-nav__badge" data-reports-badge style="display: none;"></span>
        </a>
        <p class="admin-nav__section">Promoções</p>
        <a href="promotions.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-4V4M8 16h4v4"/></svg></span>
          Ofertas
          <span class="admin-nav__badge" data-promotions-badge style="display: none;"></span>
        </a>
        <p class="admin-nav__section">Config</p>
        <a href="settings.html">
          <span class="admin-nav__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          Cadastro
        </a>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="admin-hamburger" data-sidebar-btn>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div><h1>Produtos</h1><span class="text-muted">Catálogo e estoque</span></div>
        <div class="admin-topbar__right">
          <div class="search-wrapper">
            <div class="admin-searchbar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" placeholder="Buscar..." data-admin-search>
            </div>
            <div class="search-results" data-search-results></div>
          </div>
          <div class="notif-wrapper">
            <button class="admin-icon-btn" data-notif-btn>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="admin-notif-dot" data-notif-dot></span>
            </button>
            <div class="notif-dropdown" data-notif-dropdown></div>
          </div>
          <div class="admin-user-avatar">AD</div>
          <button class="admin-icon-btn" data-admin-logout title="Sair">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>
      <section class="admin-content">
        <!-- Tabs -->
        <div class="admin-products-tabs">
          <button class="admin-products-tab is-active" data-products-tab="products">Produtos</button>
          <button class="admin-products-tab" data-products-tab="categories">Categorias</button>
        </div>

        <!-- Painel: Produtos -->
        <div data-products-panel="products">
          <div class="admin-products-header">
            <div class="admin-products-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" data-admin-product-search placeholder="Buscar produto, SKU...">
            </div>
            <button class="btn-new-product" data-new-product>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Novo Produto
            </button>
          </div>
          <div class="admin-products-grid" data-admin-products></div>
        </div>

        <!-- Painel: Categorias -->
        <div data-products-panel="categories" class="is-hidden">
          <div class="categories-toolbar">
            <p class="text-muted" style="font-size:13px;">Categorias disponíveis para vincular aos produtos.</p>
            <button class="btn-new-product" data-new-category>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nova Categoria
            </button>
          </div>
          <div class="categories-grid" data-categories-list></div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../js/ui/admin-auth.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/ui/common.js"></script>
  <script src="../../js/ui/admin-products.js"></script>
  <script src="../../js/ui/admin-search.js"></script>
  <script src="../../js/ui/admin-notifications.js"></script>
  <script src="../../js/ui/admin-badges.js"></script>
  <script src="../../js/ui/admin-notifications.js"></script>
  <script src="../../js/ui/admin-store-name.js"></script>

  <div class="modal-overlay" id="deleteConfirmOverlay">
    <div class="modal modal--sm">
      <div class="confirm-modal__body">
        <div class="confirm-modal__icon confirm-modal__icon--danger">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h3 class="confirm-modal__title">Deletar produto?</h3>
        <p id="deleteConfirmMsg" class="confirm-modal__msg"></p>
        <div class="confirm-modal__actions">
          <button id="deleteCancelBtn" class="btn-admin-cancel">Cancelar</button>
          <button id="deleteConfirmBtn" class="btn-confirm btn-confirm--danger">Deletar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
